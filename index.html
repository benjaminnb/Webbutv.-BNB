<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Min Hub</title>

    <link rel="stylesheet" href="stylesheet.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>Min Hub</h1>
        <p>Allt samlat på ett ställe</p>
    </header>

    <main class="hub">

        <div class="hub-grid">

            <a href="#" class="card">

                <div class="icon">
                    D
                </div>

                <div class="card-content">
                    <h2>Dashboard</h2>
                    <p>Se din översikt och statistik</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a href="#" class="card">

                <div class="icon">
                    P
                </div>

                <div class="card-content">
                    <h2>Projekt</h2>
                    <p>Hantera dina projekt</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>

            <a href="#" class="card">

                <div class="icon">
                    I
                </div>

                <div class="card-content">
                    <h2>Inställningar</h2>
                    <p>Anpassa din upplevelse</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>

        </div>

    </main>

</body>

</html>
