<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .hub {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      text-decoration: none;
      color: #222;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 Min Hub</h1>
    <p>Allt samlat på ett ställe</p>
  </header>

  <main class="hub">
    <div class="hub-grid">

      <a href="#" class="card">
        <div class="icon">📊</div>
        <h2>Dashboard</h2>
        <p>Se din översikt</p>
      </a>

      <a href="#" class="card">
        <div class="icon">📁</div>
        <h2>Projekt</h2>
        <p>Hantera dina projekt</p>
      </a>

      <a href="#" class="card">
        <div class="icon">👥</div>
        <h2>Team</h2>
        <p>Se och hantera teamet</p>
      </a>

      <a href="#" class="card">
        <div class="icon">⚙️</div>
        <h2>Inställningar</h2>
        <p>Ändra dina inställningar</p>
      </a>

    </div>
  </main>

</body>
</html>
