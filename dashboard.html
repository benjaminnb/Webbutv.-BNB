<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Min Hub</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <header>
        <h1>Dashboard</h1>
        <p>Din översikt</p>
    </header>

    <main class="hub">

        <div class="hub-grid">

            <a href="#" class="card">

                <div class="icon">
                    01
                </div>

                <div class="card-content">
                    <h2>Översikt</h2>
                    <p>Se sammanfattning av din aktivitet</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a href="#" class="card">

                <div class="icon">
                    02
                </div>

                <div class="card-content">
                    <h2>Senaste aktivitet</h2>
                    <p>Se vad som har hänt nyligen</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a href="#" class="card">

                <div class="icon">
                    03
                </div>

                <div class="card-content">
                    <h2>Statistik</h2>
                    <p>Se statistik och information</p>
                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <a href="index.html" class="card">

                <div class="icon">
                    X
                </div>

                <div class="card-content">
                    <h2>Tillbaka</h2>
                    <p>Gå tillbaka till startsidan</p>
                </div>

                <div class="arrow">
                    ←
                </div>

            </a>

        </div>

    </main>

</body>

</html>
